serviceAccount: projects/amuhon-staging/serviceAccounts/amuhon-cloudbuild-deployer@amuhon-staging.iam.gserviceaccount.com
timeout: 3600s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _DEPLOY_STAGING: "false"
steps:
  - id: checks
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -euc
      - |
        if [ "${PROJECT_ID}" != "amuhon-staging" ]; then
          echo "STAGING_PROJECT_MISMATCH"
          exit 1
        fi
        if ! printf '%s' "${COMMIT_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "SOURCE_COMMIT_REQUIRED"
          exit 1
        fi
        if [ "${_DEPLOY_STAGING}" = "true" ] && [ "${BRANCH_NAME}" != "codex/pdf-preview-fix-20261118" ]; then
          echo "STAGING_BRANCH_MISMATCH"
          exit 1
        fi

        npm ci
        npm run test:staging-automation-config
        npm run lint
        npx next typegen
        npx tsc --noEmit
        npm run test:order-assets
        npm run test:order-checkout
        npm run test:order-admin
        npm run test:staging-e2e-contract
        npm run test:aozora-commercial-rights
        npm run test:order-validation-sql
        npm run test:pdf-render-queue
  - id: build-renderer
    name: gcr.io/cloud-builders/docker
    waitFor: [checks]
    args:
      - build
      - --platform=linux/amd64
      - --file=Dockerfile.pdf-renderer
      - --tag=asia-northeast1-docker.pkg.dev/amuhon-staging/amuhon-pdf-renderer/pdf-renderer:${COMMIT_SHA}
      - .
  - id: offline-renderer-self-test
    name: gcr.io/cloud-builders/docker
    waitFor: [build-renderer]
    args:
      - run
      - --rm
      - --network=none
      - asia-northeast1-docker.pkg.dev/amuhon-staging/amuhon-pdf-renderer/pdf-renderer:${COMMIT_SHA}
      - --self-test
  - id: staging-preflight
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    waitFor: [offline-renderer-self-test]
    args:
      - -euc
      - |
        if [ "${_DEPLOY_STAGING}" != "true" ]; then
          echo "STAGING_DEPLOY_NOT_ENABLED"
          exit 0
        fi
        if [ "${BRANCH_NAME}" != "codex/pdf-preview-fix-20261118" ]; then
          echo "STAGING_BRANCH_MISMATCH"
          exit 1
        fi
        if ! gcloud artifacts repositories describe amuhon-pdf-renderer \
          --project=amuhon-staging --location=asia-northeast1 --format='value(name)' >/dev/null 2>&1; then
          echo "STAGING_ARTIFACT_REPOSITORY_UNAVAILABLE"
          exit 1
        fi
        if ! gcloud run jobs describe amuhon-pdf-renderer \
          --project=amuhon-staging --region=asia-northeast1 --format='value(name)' >/dev/null 2>&1; then
          echo "STAGING_RENDER_JOB_UNAVAILABLE"
          exit 1
        fi
  - id: push-staging-image
    name: gcr.io/cloud-builders/docker
    entrypoint: /bin/sh
    waitFor: [staging-preflight]
    args:
      - -c
      - |
        if [ "${_DEPLOY_STAGING}" != "true" ]; then
          echo "STAGING_IMAGE_PUSH_SKIPPED"
          exit 0
        fi
        docker push asia-northeast1-docker.pkg.dev/amuhon-staging/amuhon-pdf-renderer/pdf-renderer:${COMMIT_SHA}
  - id: update-staging-job-by-digest
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    waitFor: [push-staging-image]
    args:
      - -euc
      - |
        if [ "${_DEPLOY_STAGING}" != "true" ]; then
          echo "STAGING_JOB_UPDATE_SKIPPED"
          exit 0
        fi
        image="asia-northeast1-docker.pkg.dev/amuhon-staging/amuhon-pdf-renderer/pdf-renderer:${COMMIT_SHA}"
        digest=""
        for attempt in 1 2 3 4 5; do
          digest="$$(gcloud artifacts docker images describe "$$image" \
            --project=amuhon-staging --format='value(image_summary.digest)' 2>/dev/null || true)"
          if printf '%s' "$$digest" | grep -Eq '^sha256:[0-9a-f]{64}$$'; then
            break
          fi
          sleep 3
        done
        if ! printf '%s' "$$digest" | grep -Eq '^sha256:[0-9a-f]{64}$$'; then
          echo "STAGING_IMAGE_DIGEST_UNAVAILABLE"
          exit 1
        fi
        gcloud run jobs update amuhon-pdf-renderer \
          --project=amuhon-staging \
          --region=asia-northeast1 \
          --image="$$image@$$digest" \
          --update-labels="source-commit=${COMMIT_SHA}"
